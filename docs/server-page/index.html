<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panduan Server · Trans Niaga</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f24; --muted: #5d6670; --line: #dde1e6;
    --navy: #0e3c69; --orange: #ea7b25; --code-bg: #eef1f4; --danger: #c62828; --quote: #fff4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b; --card: #1a2027; --text: #e6e9ec; --muted: #9aa4ae; --line: #2c343d;
      --navy: #7fb2e5; --orange: #f0954f; --code-bg: #232b33; --danger: #ef6b6b; --quote: #2a2219;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
  .bar h1 { margin: 0; font-size: 1.05rem; color: var(--navy); }
  .bar .who { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--navy); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); padding: 6px 12px; }
  button:disabled { opacity: 0.6; cursor: default; }
  .hidden { display: none !important; }

  /* login */
  .login { max-width: 380px; margin: 12vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  .login h2 { margin: 0 0 4px; color: var(--navy); font-size: 1.2rem; }
  .login p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
  .login label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .login button { width: 100%; margin-top: 20px; }
  .error { color: var(--danger); font-size: 0.88rem; margin-top: 12px; }

  /* guide */
  .layout { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
  nav.toc { position: sticky; top: 16px; font-size: 0.88rem; }
  nav.toc strong { display: block; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  nav.toc a { display: block; padding: 5px 10px; border-left: 2px solid var(--line); color: var(--text); text-decoration: none; }
  nav.toc a:hover { border-left-color: var(--orange); color: var(--orange); }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 32px 32px; min-width: 0; }
  article h2 { font-size: 1.55rem; color: var(--navy); margin: 24px 0 8px; }
  article h3 { font-size: 1.2rem; color: var(--navy); margin: 36px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
  article h4 { font-size: 1rem; margin: 22px 0 8px; }
  article p, article li { max-width: 78ch; }
  article a { color: var(--orange); }
  code { font: 0.86em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  pre { position: relative; background: var(--code-bg); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
  pre code { background: none; padding: 0; overflow-wrap: normal; }
  pre button.copy { position: absolute; top: 8px; right: 8px; padding: 3px 10px; font-size: 0.75rem; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  th { background: var(--code-bg); font-weight: 600; }
  blockquote { margin: 16px 0; padding: 10px 16px; background: var(--quote); border-left: 4px solid var(--orange); border-radius: 0 8px 8px 0; }
  blockquote p { margin: 4px 0; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-top: 24px; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    nav.toc { position: static; }
    article { padding: 4px 18px 24px; }
  }
  @media print {
    header, nav.toc, pre button.copy { display: none !important; }
    .layout { display: block; padding: 0; }
    article { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Panduan Server · Trans Niaga</h1>
    <span class="who hidden" id="who"></span>
    <button class="ghost hidden" id="logout" type="button">Keluar</button>
  </div>
</header>

<form class="login hidden" id="login" autocomplete="on">
  <h2>Masuk sebagai Superadmin</h2>
  <p>Panduan server hanya dapat dibuka oleh akun superadmin.</p>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="submit">Masuk</button>
  <div class="error hidden" id="error" role="alert"></div>
</form>

<div class="layout hidden" id="guide">
  <nav class="toc" id="toc" aria-label="Daftar isi"></nav>
  <article id="content"></article>
</div>

<script src="/api/docs/server/app.js"></script>
</body>
</html>
