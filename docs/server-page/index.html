<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Panduan Server · Trans Niaga</title>
<script src="/api/docs/server/theme.js"></script>
<style>
  /* Two themes. Light is the default; dark applies when chosen (data-theme="dark"), or when nothing was chosen and
     the browser asks for dark. Keep the two dark blocks the same. */
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f24; --muted: #5d6670; --line: #dde1e6;
    --navy: #0e3c69; --orange: #c9631a; --code-bg: #eef1f4; --danger: #c62828; --quote: #fff4ea;
    --btn-bg: #0e3c69; --btn-fg: #ffffff; --active-bg: #0e3c69; --active-fg: #ffffff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12161b; --card: #1a2027; --text: #e6e9ec; --muted: #9aa4ae; --line: #2c343d;
    --navy: #8fbdea; --orange: #f0954f; --code-bg: #232b33; --danger: #ef6b6b; --quote: #2a2219;
    --btn-bg: #8fbdea; --btn-fg: #0b1620; --active-bg: #8fbdea; --active-fg: #0b1620;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12161b; --card: #1a2027; --text: #e6e9ec; --muted: #9aa4ae; --line: #2c343d;
      --navy: #8fbdea; --orange: #f0954f; --code-bg: #232b33; --danger: #ef6b6b; --quote: #2a2219;
      --btn-bg: #8fbdea; --btn-fg: #0b1620; --active-bg: #8fbdea; --active-fg: #0b1620;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .bar h1 { margin: 0; font-size: 1.05rem; color: var(--navy); margin-right: auto; }
  .bar .who { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; }
  button.ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); padding: 6px 12px; }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* language (ID / EN) and theme (light / dark) switches */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; color: var(--text); border-radius: 0; padding: 6px 12px; font-size: 0.85rem; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--active-bg); color: var(--active-fg); }

  /* login */
  .login { max-width: 380px; margin: 10vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  .login h2 { margin: 0 0 4px; color: var(--navy); font-size: 1.2rem; }
  .login p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
  .login label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .login button { width: 100%; margin-top: 20px; }
  .error { color: var(--danger); font-size: 0.88rem; margin-top: 12px; }

  /* guide */
  .layout { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
  nav.toc { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; font-size: 0.88rem; }
  nav.toc strong { display: block; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  nav.toc a { display: block; padding: 5px 10px; border-left: 2px solid var(--line); color: var(--text); text-decoration: none; }
  nav.toc a:hover { border-left-color: var(--orange); color: var(--orange); }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 32px 32px; min-width: 0; }
  article h2 { font-size: 1.55rem; color: var(--navy); margin: 24px 0 8px; }
  article h3 { font-size: 1.2rem; color: var(--navy); margin: 36px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); scroll-margin-top: 76px; }
  article h4 { font-size: 1rem; margin: 22px 0 8px; scroll-margin-top: 76px; }
  article p, article li { max-width: 78ch; }
  article a { color: var(--orange); }
  code { font: 0.86em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  pre { position: relative; background: var(--code-bg); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
  pre code { background: none; padding: 0; overflow-wrap: normal; }
  pre button.copy { position: absolute; top: 8px; right: 8px; padding: 3px 10px; font-size: 0.75rem; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  th { background: var(--code-bg); font-weight: 600; }
  blockquote { margin: 16px 0; padding: 10px 16px; background: var(--quote); border-left: 4px solid var(--orange); border-radius: 0 8px 8px 0; }
  blockquote p { margin: 4px 0; }
  /* screenshots of the website (always shown as taken, in both themes) */
  figure { margin: 14px 0 22px; max-width: 760px; }
  figure img { display: block; width: 100%; height: auto; aspect-ratio: 1024 / 640; object-fit: cover; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; }
  figcaption { margin-top: 6px; color: var(--muted); font-size: 0.82rem; }
  figure a { cursor: zoom-in; display: block; }
  /* a picture opened larger (click, Esc or the button closes it) */
  .zoom { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; background: rgba(0, 0, 0, 0.82); cursor: zoom-out; }
  .zoom img { max-width: 100%; max-height: calc(100vh - 110px); object-fit: contain; border-radius: 10px; background: #fff; cursor: default; }
  .zoom p { margin: 0; color: #fff; font-size: 0.9rem; text-align: center; max-width: 720px; }
  .zoom-close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.18); color: #fff; font-size: 1.6rem; line-height: 1; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-top: 24px; }

  @media (max-width: 860px) {
    header { position: static; }
    .layout { grid-template-columns: 1fr; padding: 16px; }
    nav.toc { position: static; max-height: none; }
    article { padding: 4px 18px 24px; }
    article h3, article h4 { scroll-margin-top: 12px; }
  }
  @media print {
    header, nav.toc, pre button.copy { display: none !important; }
    .layout { display: block; padding: 0; }
    article { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 data-i18n="title">Panduan Server · Trans Niaga</h1>
    <div class="seg" role="group" aria-label="Bahasa / Language">
      <button type="button" data-lang="id" aria-pressed="true">ID</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="seg" role="group" id="themes" aria-label="Tema">
      <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n="light">Terang</button>
      <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n="dark">Gelap</button>
    </div>
    <span class="who hidden" id="who"></span>
    <button class="ghost hidden" id="logout" type="button">Keluar</button>
  </div>
</header>

<form class="login hidden" id="login" autocomplete="on">
  <h2 data-i18n="loginTitle">Masuk sebagai Superadmin</h2>
  <p data-i18n="loginHint">Panduan server hanya dapat dibuka oleh akun superadmin.</p>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="submit" data-i18n="signIn">Masuk</button>
  <div class="error hidden" id="error" role="alert"></div>
</form>

<div class="layout hidden" id="guide">
  <nav class="toc" id="toc" aria-label="Daftar isi"></nav>
  <article id="content"></article>
</div>

<script src="/api/docs/server/app.js"></script>
</body>
</html>
